<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo de productos</title>
<style>
:root{font:16px system-ui;color:#17302a;background:#f3f6f2}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:50px auto;padding:0 24px}header{margin-bottom:30px}h1{font-size:36px;margin:8px 0}h2{margin-top:0;font-size:20px}small{color:#61716b}.layout{display:grid;grid-template-columns:300px 1fr;gap:24px}.card{background:white;padding:24px;border:1px solid #dbe3dc;border-radius:14px}label{display:block;font-size:14px;margin:14px 0 6px}input{width:100%;padding:11px;border:1px solid #aebeb4;border-radius:7px;font:inherit}button{padding:10px 14px;border:0;border-radius:7px;background:#206348;color:white;cursor:pointer;font:inherit}button:disabled{opacity:.5;cursor:wait}.secondary{color:#244d3b;background:#e9f0e9}.danger{color:#9c2929;background:#fcecec}form button{margin-top:18px}.bar{display:flex;gap:8px;margin-bottom:20px}.bar input{min-width:0}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #e6ebe6}th{font-size:13px;color:#61716b}td button{font-size:13px;margin:2px}#notice{padding:12px 0;min-height:44px}#notice.error{color:#a52626}.scroll{overflow:auto}.empty{text-align:center;padding:30px;color:#61716b}@media(max-width:800px){main{margin-top:24px}.layout{grid-template-columns:1fr}h1{font-size:28px}.card{padding:18px}}
</style>
<main><header><small>PROGRAMACIÓN III · PRÁCTICA CRUD</small><h1>Catálogo de productos</h1><p>Administra productos, precios y existencias en un solo lugar.</p></header>
<div id="notice" role="status" aria-live="polite"></div><div class="layout">
<section class="card"><h2 id="form-title">Nuevo producto</h2><form id="form"><label for="name">Nombre</label><input id="name" required maxlength="100" autocomplete="off"><label for="price">Precio en RD$</label><input id="price" type="number" required min="0" max="9999999" step="0.01"><label for="stock">Existencias</label><input id="stock" type="number" required min="0" max="1000000" step="1"><button id="save">Guardar producto</button> <button id="cancel" type="button" class="secondary" hidden>Cancelar</button></form></section>
<section class="card"><h2>Productos registrados</h2><form id="search" class="bar"><input id="query" aria-label="Buscar por nombre" placeholder="Buscar por nombre" maxlength="100"><button>Buscar</button><button type="button" id="all" class="secondary">Todos</button></form><div class="scroll"><table><thead><tr><th>Producto</th><th>Precio</th><th>Existencias</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></div><p id="count"></p></section></div></main>
<script>
let editing=null; const $=id=>document.getElementById(id); const money=new Intl.NumberFormat('es-DO',{style:'currency',currency:'DOP'});
function notice(message,error=false){$('notice').textContent=message;$('notice').classList.toggle('error',error)}
async function api(url,method='GET',data){const response=await fetch(url,{method,headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const result=await response.json();if(!response.ok)throw Error(result.error||'No se pudo completar la operación.');return result}
function reset(){editing=null;$('form').reset();$('form-title').textContent='Nuevo producto';$('save').textContent='Guardar producto';$('cancel').hidden=true}
async function load(){try{const q=$('query').value.trim();const products=await api(q?'/api/search?q='+encodeURIComponent(q):'/api/products');$('rows').replaceChildren();for(const p of products){const tr=document.createElement('tr');for(const text of [p.name,money.format(p.price),p.stock]){const td=document.createElement('td');td.textContent=text;tr.append(td)}const actions=document.createElement('td');const edit=document.createElement('button');edit.textContent='Editar';edit.className='secondary';edit.onclick=()=>{editing=p.id;$('name').value=p.name;$('price').value=p.price;$('stock').value=p.stock;$('form-title').textContent='Editar producto';$('save').textContent='Guardar cambios';$('cancel').hidden=false;$('name').focus()};const remove=document.createElement('button');remove.textContent='Eliminar';remove.className='danger';remove.onclick=async()=>{if(!confirm('¿Eliminar el producto «'+p.name+'»?'))return;remove.disabled=true;try{await api('/api/products/'+p.id,'DELETE');if(editing===p.id)reset();await load();notice('Producto eliminado.')}catch(e){notice(e.message,true)}finally{remove.disabled=false}};actions.append(edit,remove);tr.append(actions);$('rows').append(tr)}$('count').textContent=products.length+' producto(s)';if(!products.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=4;td.className='empty';td.textContent=q?'No hay productos que coincidan.':'Todavía no hay productos. Registra el primero.';tr.append(td);$('rows').append(tr)}}catch(e){notice(e.message,true)}}
$('form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{await api(editing?'/api/products/'+editing:'/api/products',editing?'PUT':'POST',{name:$('name').value,price:$('price').value,stock:Number($('stock').value)});reset();await load();notice('Producto guardado correctamente.')}catch(e){notice(e.message,true)}finally{$('save').disabled=false}};
$('cancel').onclick=reset;$('search').onsubmit=e=>{e.preventDefault();load()};$('all').onclick=()=>{$('query').value='';load()};load();
</script></html>
